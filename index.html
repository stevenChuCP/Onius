<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onius - Base64 Tool</title>
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
    <link rel="shortcut icon" href="./favicon.ico">
    <link rel="manifest" href="./manifest.webmanifest">
    <meta name="theme-color" content="#6366f1">
  <script type="module" crossorigin src="./assets/index-Ck4IMq80.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-DnI4kHvI.css">
</head>

<body>
    <div id="app">
        <header>
            <h1>Onius</h1>
            <p>High-performance Base64 encoding/decoding powered by WebAssembly</p>
        </header>

        <main>
            <div class="card wide">
                <div class="converter-grid">
                    <div class="column">
                        <div class="field-header">
                            <label for="from-fmt">From</label>
                            <select id="from-fmt">
                                <option value="plain" selected>Text</option>
                                <option value="base64">Base64</option>
                                <option value="base64url">Base64URL</option>
                                <option value="hex">Hex</option>
                            </select>
                        </div>
                        <textarea id="input" placeholder="Enter input or drop a file here..."></textarea>
                    </div>

                    <div class="controls">
                        <button id="swap-btn" class="ghost" title="Swap input/output">⇄</button>
                    </div>

                    <div class="column">
                        <div class="field-header">
                            <label for="to-fmt">To</label>
                            <select id="to-fmt">
                                <option value="plain">Text</option>
                                <option value="base64" selected>Base64</option>
                                <option value="base64url">Base64URL</option>
                                <option value="hex">Hex</option>
                            </select>
                        </div>
                        <textarea id="output" readonly placeholder="Result will appear here..."></textarea>
                    </div>
                </div>

                <div id="error-msg" class="error hidden"></div>
            </div>
        </main>

        <footer>
            <p>Powered by <a href="https://crates.io/crates/base64" target="_blank" rel="noopener noreferrer">base64</a>
            </p>
        </footer>
    </div>
</body>

</html>
