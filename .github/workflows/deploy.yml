name: Deploy to GitHub Pages

on:
  push:
    branches:
      - dev  # or master, change this to your main branch name
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rust-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        # no wasm32 target needed here: cargo test runs natively — the
        # #[wasm_bindgen] JS-import glue in apps/web/src/archiver.rs is
        # cfg-gated to target_arch = "wasm32" and doesn't block native
        # compilation of the crate or its #[cfg(test)] unit tests.

      - name: cargo test --workspace
        run: cargo test --workspace

  js-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/web

      - name: Run unit tests
        run: npm run test:unit
        working-directory: apps/web

  # Playwright e2e is manually-triggered only for now (workflow_dispatch),
  # not gating deploys yet — headless-browser suites are the most common
  # source of new CI flakiness, and this hasn't run in CI's environment
  # before. Promote to `needs: [..., e2e]` on build-and-deploy below once
  # it's run stably here a few times.
  e2e:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        run: wasm-pack build apps/web --target web

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/web

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Run e2e tests
        run: npm run test:e2e
        working-directory: apps/web

  build-and-deploy:
    needs: [rust-unit, js-unit]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        run: wasm-pack build apps/web --target web

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Dependencies
        run: |
          cd apps/web
          npm install

      - name: Build Web App
        run: |
          cd apps/web
          npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apps/web/dist
          cname: www.onius.app
          # folder: apps/web/dist # alternative if using different action
